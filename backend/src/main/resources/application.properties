spring.application.name=isetconnect-backend
server.port=${PORT:8080}

spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/isetconnect_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false


app.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-please-0123456789-abcdef}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

app.upload-dir=${UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

app.admin.name=${ADMIN_NAME:Administrator}
app.admin.email=${ADMIN_EMAIL:admin@isetconnect.local}
app.admin.password=${ADMIN_PASSWORD:Admin@12345}
